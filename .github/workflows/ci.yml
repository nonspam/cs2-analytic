name: CS2 Analytics CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax checks
        run: |
          node --check app.js
          node --check supabase_adapter.js
          node --check validation.js
      - name: Unit tests
        run: |
          node tests/validation.test.js
          node tests/operations.test.js
          node tests/api_contract.test.js
      - name: Verify shared validator is referenced
        run: |
          grep -q 'CS2Validation' app.js
          grep -q 'validation.js' supabase/functions/cs2-admin/index.ts

      - name: Edge Function type check
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Deno check
        run: deno check supabase/functions/cs2-admin/index.ts
